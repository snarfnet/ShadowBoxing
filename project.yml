name: ShadowBoxing
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  ShadowBoxing:
    type: application
    platform: iOS
    sources: [ShadowBoxing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.shadowboxing
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 83VGKGSQUH
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera is used to detect your boxing form and count punches in real time."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save recorded shadow boxing sessions to your photo library."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"
